name: scraper

# Runs scraper/run.js on a hosted Azure runner every 10 minutes, then
# rsyncs the resulting JSON to /var/www/promo-tool on the VPS over a
# restricted SSH key. See scraper/deploy.md for the one-time secret + key
# setup and specs/005-vps-feed-cutover/research.md R9 for why the scraper
# runs here and not on the VPS itself.
#
# GitHub's scheduled-workflow scheduler is best-effort — slots may slip
# 5–15 min under load. SC-002 budgets 20 min of staleness for this reason.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scrape into RUNNER_TEMP
        env:
          OUT_DIR: ${{ runner.temp }}/promo-out
        run: |
          mkdir -p "$OUT_DIR/odds"
          node scraper/run.js
          echo '--- written files ---'
          ls -la "$OUT_DIR" "$OUT_DIR/odds"

      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync to VPS
        env:
          OUT_DIR: ${{ runner.temp }}/promo-out
          DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
        run: |
          # The remote side runs rrsync pinned to /var/www/promo-tool, so
          # the path we send (`./`) is interpreted relative to that root.
          rsync -az --delete \
            "$OUT_DIR/" \
            "$DEPLOY_USER@195.201.99.206:./"
